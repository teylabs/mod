name: Fix PHP code style issues

on:
  push:
    branches: [main, '*.x']
    paths:
      - '**.php'
  pull_request:
    paths:
      - '**.php'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-code-styling:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      # Pint runs from Composer rather than a Docker-based action, so the job
      # doesn't depend on pulling images from Docker Hub (which rate-limits runners).
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Fix PHP code style issues
        run: ./vendor/bin/pint

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Fix styling
