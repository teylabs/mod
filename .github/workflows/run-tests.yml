name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.4, 8.3]
        laravel: [13.*, 12.*]
        stability: [prefer-lowest, prefer-stable]
        include:
            -   laravel: 13.*
                testbench: "11.*"
                carbon: "^3.8.4"
                pest: "^4.0"
                pest-plugin: "^4.0"
            -   laravel: 12.*
                testbench: "^10.6"
                carbon: "^3.8.4"
                pest: "^4.0"
                pest-plugin: "^4.0"
            # PHP 8.5 on the Laravel versions that support it, latest dependencies only.
            -   os: ubuntu-latest
                php: 8.5
                laravel: 13.*
                stability: prefer-stable
                testbench: "11.*"
                carbon: "^3.8.4"
                pest: "^4.0"
                pest-plugin: "^4.0"
            -   os: ubuntu-latest
                php: 8.5
                laravel: 12.*
                stability: prefer-stable
                testbench: "^10.6"
                carbon: "^3.8.4"
                pest: "^4.0"
                pest-plugin: "^4.0"
            -   os: windows-latest
                php: 8.5
                laravel: 13.*
                stability: prefer-stable
                testbench: "11.*"
                carbon: "^3.8.4"
                pest: "^4.0"
                pest-plugin: "^4.0"
            -   os: windows-latest
                php: 8.5
                laravel: 12.*
                stability: prefer-stable
                testbench: "^10.6"
                carbon: "^3.8.4"
                pest: "^4.0"
                pest-plugin: "^4.0"

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        shell: bash
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:${{ matrix.carbon }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix['pest-plugin'] }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed dependencies
        shell: bash
        run: composer show --direct

      - name: Execute tests
        if: runner.os != 'Windows'
        run: vendor/bin/pest --ci --no-coverage

      - name: Execute Windows tests with event diagnostics
        if: runner.os == 'Windows'
        timeout-minutes: 23
        run: |
          $env:GIT_TRACE_PERFORMANCE = (Join-Path $env:GITHUB_WORKSPACE 'git-performance.log').Replace('\', '/')
          $env:MOD_RENAME_DIAGNOSTIC_LOG = Join-Path $env:GITHUB_WORKSPACE 'rename-timings.log'
          vendor/bin/pest --ci --no-coverage --debug --log-events-verbose-text=phpunit-events.log --log-junit=junit.xml

      - name: Print Windows test events
        if: always() && runner.os == 'Windows'
        run: |
          if (Test-Path phpunit-events.log) { Get-Content phpunit-events.log }
          if (Test-Path git-performance.log) { Get-Content git-performance.log -Tail 200 }
          if (Test-Path rename-timings.log) { Get-Content rename-timings.log -Tail 200 }

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ strategy.job-index }}
          path: |
            junit.xml
            phpunit-events.log
            git-performance.log
            rename-timings.log
          if-no-files-found: ignore

  boost:
    name: Verify Boost resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: boost-composer-${{ runner.os }}-${{ github.run_id }}
          restore-keys: boost-composer-${{ runner.os }}-
      - name: Verify the Boost skill in fresh Laravel apps
        run: tests/boost/verify-boost.sh "$RUNNER_TEMP/boost-verify" 12 13
